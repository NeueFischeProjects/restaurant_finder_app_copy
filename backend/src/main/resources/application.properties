spring.application.name=restaurant-finder
#fehlt mongodb uri dann wird mongodb local verwendet
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/restaurantfinder}
server.port=8080
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.github.scope[]=none
# wohin nach dem Login weitergeleitet wird
app.url=${APP_URL:http://localhost:5173}
# nötig für Render (HTTPS), sonst stimmt die Callback-URL nicht
server.forward-headers-strategy=framework